# Typecheck, lint and all tests on every push to main and every pull request.
# API tests start a throwaway Postgres + pgvector with Testcontainers (Docker is available on the runner).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # One package at a time: each API test file starts its own Postgres container.
      - run: pnpm -r --workspace-concurrency=1 test
