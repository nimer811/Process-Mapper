# Interview quality: a simulated employee is interviewed by the real app and an LLM judge scores
# what was captured against the known process. Fails below the quality bar. Needs the
# LLM_API_KEY repository secret (Settings → Secrets and variables → Actions).
name: Interview evaluation

on:
  workflow_dispatch:
    inputs:
      max_turns:
        description: Maximum turns per scenario
        default: '30'
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the model key is configured
        run: |
          if [ -z "$LLM_API_KEY" ]; then echo "::error::Add the LLM_API_KEY repository secret to run the evaluation."; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the app
        run: |
          printf 'LLM_PROVIDER=openai\nLLM_API_KEY=%s\n' "$LLM_API_KEY" > .env
          docker compose --profile app up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:8080/ready && break; sleep 2; done
      - name: Run the evaluation (quality bar)
        env:
          DATABASE_URL: postgres://process_ai:process_ai@localhost:5433/process_ai
        run: >
          pnpm --filter @process-ai/api eval:interview --label ci
          --max-turns ${{ github.event.inputs.max_turns || '30' }}
          --min-step-recall 70 --min-specific-actors 70 --min-follow-up 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interview-eval-results
          path: apps/api/scripts/eval/results.jsonl
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile app logs app --tail 200
