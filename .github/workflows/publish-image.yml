# Builds the Process AI image on every push to main and publishes it to GitHub Container Registry
# (ghcr.io/nimer811/process-mapper), where hosting such as Azure Container Apps pulls it from.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'deploy/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nimer811/process-mapper:latest
            ghcr.io/nimer811/process-mapper:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
